name: Publish to npm

# Make a GitHub release (tag like v7.0.1) and this publishes that version to npm.
# It uses npm "trusted publishing": no token is stored anywhere. npm checks that the request
# really comes from this workflow in this repository, and adds a provenance badge automatically.
# One-time setup: npmjs.com → pocket-terminal → Settings → Trusted Publisher → GitHub Actions,
# user UtsavDoye20122005, repository pocket-terminal, workflow publish.yml.
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # lets npm verify this workflow (trusted publishing)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or newer
      - name: Tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "Release tag v$TAG but package.json says $PKG. Bump the version first."; exit 1; }
      - name: Unit tests
        run: npm ci --no-fund --no-audit && npm test
        working-directory: agent
      - name: Publish
        run: npm publish --access public
