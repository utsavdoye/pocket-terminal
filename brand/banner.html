<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Plex;src:url(../docs/app/fonts/ibm-plex-sans-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Plex;src:url(../docs/app/fonts/ibm-plex-sans-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:JB;src:url(../docs/app/fonts/jetbrains-mono-latin-400-normal.woff2)}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
body{background:radial-gradient(55% 75% at 80% 30%,rgba(245,184,67,.32),transparent 70%),#F4F5F7;font-family:Plex,sans-serif;color:#0F1217;display:grid;grid-template-columns:1.25fr .75fr;align-items:center;padding:0 6vw;box-sizing:border-box}
.brand{display:flex;align-items:center;gap:1.6vw;font-weight:600;font-size:3vw;letter-spacing:-.02em;margin-bottom:3.4vh}
.brand img{width:5.6vw;height:5.6vw}
h1{font-size:6.6vw;line-height:1.02;letter-spacing:-.04em;margin:0 0 2.8vh;font-weight:600}
h1 em{font-style:normal;color:#B87400}
p{font-size:2.1vw;color:#5F6672;margin:0 0 4.4vh;line-height:1.35;max-width:36vw}
.cmd{display:inline-flex;gap:1vw;align-items:center;background:#0F1217;color:#ECEAF4;font:2vw JB,monospace;padding:1.5vh 1.8vw;border-radius:1.2vw}
.cmd b{color:#F5B843;font-weight:400}
.url{position:absolute;left:6vw;bottom:5vh;font-size:1.5vw;color:#9AA1AC}
.phone{justify-self:center;width:22vw;border-radius:3vw;padding:.75vw;background:#0F1217;box-shadow:0 3vw 6vw rgba(16,24,40,.25);transform:rotate(3deg)}
.phone img{width:100%;border-radius:2.3vw;display:block}
</style></head><body>
<div><div class="brand"><img src="mark.svg">Pocket Terminal</div>
<h1>Your terminal,<br><em>in your pocket.</em></h1>
<p>Answer Claude Code, run commands, open localhost. From anywhere, even with the lid closed.</p>
<div class="cmd"><b>$</b>npx pocket-terminal</div></div>
<div class="phone"><img src="../docs/screenshots/agent.png"></div>
<div class="url">pocket-terminal.utsavdoye.com · free &amp; open source</div>
</body></html>
