<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Geist;src:url(../docs/fonts/Geist-Variable.woff2);font-weight:100 900}
@font-face{font-family:GeistMono;src:url(../docs/fonts/GeistMono-Variable.woff2);font-weight:100 900}
html,body{margin:0;width:100vw;height:100vh;overflow:hidden}
body{position:relative;box-sizing:border-box;padding:0 6vw;display:grid;grid-template-columns:1.3fr .7fr;align-items:center;color:#EDEDEF;font-family:Geist,sans-serif;
  background:radial-gradient(45% 70% at 82% 95%,rgba(255,138,61,.35),rgba(245,184,67,.1) 50%,transparent 75%),#08080A}
body::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.06) 1px,transparent 1px);background-size:4.6vw 4.6vw;-webkit-mask-image:radial-gradient(70% 80% at 30% 20%,#000 20%,transparent 75%)}
.l{position:relative}
.brand{display:flex;align-items:center;gap:1.4vw;font-weight:600;font-size:2.6vw;letter-spacing:-.02em;margin-bottom:4vh}
.brand img{width:4.8vw;height:4.8vw;border-radius:1vw}
.brand span{font:500 1.2vw GeistMono,monospace;color:#71717A;padding:.3vw .7vw;border:1px solid rgba(255,255,255,.15);border-radius:.6vw}
h1{font-size:6.8vw;line-height:1;letter-spacing:-.05em;margin:0 0 3.4vh;font-weight:600;background:linear-gradient(180deg,#fff 35%,#9A9AA3);-webkit-background-clip:text;color:transparent}
h1 em{font-style:normal;background:linear-gradient(90deg,#FFD27A,#F5B843 45%,#FF8A3D);-webkit-background-clip:text;color:transparent}
p{font-size:2vw;color:#A1A1AA;margin:0 0 5vh;line-height:1.4;max-width:42vw}
.cmd{display:inline-flex;gap:1.2vw;align-items:center;background:#111114;border:1px solid rgba(255,255,255,.14);font:2vw GeistMono,monospace;padding:1.6vh 2vw;border-radius:1vw}
.cmd b{color:#F5B843;font-weight:400}
.url{position:absolute;left:6vw;bottom:5.5vh;font:1.35vw GeistMono,monospace;color:#71717A}
.url b{color:#F5B843;font-weight:400}
.phone{position:relative;justify-self:center;width:21vw;border-radius:3vw;padding:.7vw;background:linear-gradient(#27272C,#111114);box-shadow:0 0 0 1px rgba(255,255,255,.18) inset,0 3vw 6vw rgba(0,0,0,.6),0 0 6vw rgba(245,160,60,.2);transform:rotate(3deg)}
.phone img{width:100%;border-radius:2.35vw;display:block}
</style></head><body>
<div class="l"><div class="brand"><img src="mark.svg">Pocket Terminal<span>v7</span></div>
<h1>Your terminal,<br><em>in your pocket.</em></h1>
<p>Answer AI coding agents, run commands, open localhost. From anywhere, even with the lid closed.</p>
<div class="cmd"><b>$</b>npx pocket-terminal</div></div>
<div class="phone"><img src="../docs/screenshots/agent.png"></div>
<div class="url"><b>›</b> pocket-terminal.utsavdoye.com · free &amp; open source</div>
</body></html>
